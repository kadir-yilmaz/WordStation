name: WebUI-CI

on:
  push:
    branches: [ main ]
    paths:
      - 'WordStation.WebUI/**'
      - 'WordStation.UITests/**'
      - 'WordStation.BLL/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'WordStation.WebUI/**'
      - 'WordStation.UITests/**'
      - 'WordStation.BLL/**'

jobs:
  test:
    name: Build & Test UI
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Build
      run: dotnet build WordStation.sln -c Debug
    - name: Install Playwright Browsers
      run: |
        $playwrightPath = Get-ChildItem -Path "WordStation.UITests/bin/Debug" -Filter "playwright.ps1" -Recurse | Select-Object -First 1
        if ($playwrightPath) {
          powershell -ExecutionPolicy Bypass -File $playwrightPath.FullName install
        }
    - name: Start WebUI in Background
      shell: pwsh
      run: |
        Start-Process dotnet -ArgumentList "run --project WordStation.WebUI/WordStation.WebUI.csproj --urls http://localhost:5000"
        Start-Sleep -Seconds 20
    - name: Run UI Tests
      env:
        TEST_BASE_URL: http://localhost:5000
        GITHUB_ACTIONS: "true"
      run: dotnet test WordStation.UITests --no-build -c Debug
