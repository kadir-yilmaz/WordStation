name: WebUI-CD

on:
  workflow_run:
    workflows: ["WebUI-CI"]
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    name: Deploy WebUI
    runs-on: windows-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore
      run: dotnet restore
    - name: Update Production API URL
      shell: pwsh
      env:
        API_BASE: ${{ secrets.API_BASE_URL }}
      run: |
        $appsettingsPath = "WordStation.WebUI/appsettings.Production.json"
        $json = Get-Content $appsettingsPath -Raw | ConvertFrom-Json
        $json.ApiSettings.BaseUrl = $env:API_BASE
        $json | ConvertTo-Json -Depth 10 | Set-Content $appsettingsPath
    - name: Deploy WebUI
      run: |
        dotnet publish WordStation.WebUI -c Release `
          /p:WebPublishMethod=MSDeploy `
          /p:MSDeployPublishMethod=WMSVC `
          /p:MsDeployServiceUrl=${{ secrets.WEBDEPLOY_SERVER }} `
          /p:DeployIisAppPath=${{ secrets.WEBDEPLOY_SITENAME }} `
          /p:UserName=${{ secrets.WEBDEPLOY_USERNAME }} `
          /p:Password=${{ secrets.WEBDEPLOY_PASSWORD }} `
          /p:AllowUntrustedCertificate=true `
          /p:EnableMsDeployAppOffline=true `
          /p:SkipExtraFilesOnServer=true
