name: WebUI-CD

on:
  workflow_run:
    workflows: ["WebUI-CI"]
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    name: Deploy WebUI
    runs-on: windows-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore
      run: dotnet restore
    - name: Create appsettings.json from Secrets
      shell: pwsh
      run: |
        $appsettings = @"
        ${{ secrets.WEBUI_APPSETTINGS_JSON }}
        "@
        $appsettings | Out-File -FilePath "WordStation.WebUI/appsettings.json" -Encoding utf8
    - name: Deploy WebUI
      run: |
        dotnet publish WordStation.WebUI -c Release `
          /p:WebPublishMethod=MSDeploy `
          /p:MSDeployPublishMethod=WMSVC `
          /p:MsDeployServiceUrl=${{ secrets.WEBDEPLOY_SERVER }} `
          /p:DeployIisAppPath=${{ secrets.WEBDEPLOY_SITENAME }} `
          /p:UserName=${{ secrets.WEBDEPLOY_USERNAME }} `
          /p:Password=${{ secrets.WEBDEPLOY_PASSWORD }} `
          /p:AllowUntrustedCertificate=true `
          /p:EnableMsDeployAppOffline=true `
          /p:SkipExtraFilesOnServer=true
