name: WebUI (CI/CD)

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'UI Testleri çalıştırılsın mı?'
        required: true
        type: boolean
        default: false

jobs:
  pipeline:
    name: 🚀 WebUI Pipeline (Build & Deploy)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore

    - name: 🎭 Install Playwright Browsers
      if: ${{ inputs.run_tests == true }}
      run: |
        dotnet build WordStation.sln -c Debug
        $playwrightPath = Get-ChildItem -Path "WordStation.UITests/bin/Debug" -Filter "playwright.ps1" -Recurse | Select-Object -First 1
        if ($playwrightPath) {
          powershell -ExecutionPolicy Bypass -File $playwrightPath.FullName install
        }

    - name: 🧪 Start WebUI & Run Tests
      if: ${{ inputs.run_tests == true }}
      shell: pwsh
      env:
        ASPNETCORE_ENVIRONMENT: "Development"
        TEST_BASE_URL: "http://localhost:5000"
        GITHUB_ACTIONS: "true"
      run: |
        Start-Process dotnet -ArgumentList "run --project WordStation.WebUI/WordStation.WebUI.csproj --urls http://localhost:5000"
        
        $maxRetries = 15
        $retry = 0
        $ready = $false
        while ($retry -lt $maxRetries -and -not $ready) {
            Start-Sleep -Seconds 2
            try {
                $res = Invoke-WebRequest -Uri "http://localhost:5000/Account/Login" -UseBasicParsing -TimeoutSec 5
                if ($res.StatusCode -eq 200) {
                    $ready = $true
                    Write-Host "✅ WebUI hazır!"
                }
            } catch {
                Write-Host "⏳ WebUI baslatiliyor... ($($retry + 1)/$maxRetries)"
            }
            $retry++
        }
        dotnet test WordStation.UITests -c Debug

    - name: Create appsettings.json from Secrets
      shell: pwsh
      env:
        APPSETTINGS_JSON: ${{ secrets.WEBUI_APPSETTINGS_JSON }}
      run: |
        $env:APPSETTINGS_JSON | Out-File -FilePath "WordStation.WebUI/appsettings.json" -Encoding utf8

    - name: 🚀 Deploy WebUI via WebDeploy
      shell: pwsh
      env:
        WEB_DEPLOY_JSON: ${{ secrets.WEB_DEPLOY_JSON }}
      run: |
        $rawJson = $env:WEB_DEPLOY_JSON | Out-String
        $deployConfig = $rawJson | ConvertFrom-Json
        $server = $deployConfig.WebUI.Server
        if (-not $server.StartsWith("http")) {
            $server = "https://$server/MsDeploy.axd"
        }
        $site = $deployConfig.WebUI.SiteName
        $user = $deployConfig.WebUI.UserName
        $pass = $deployConfig.WebUI.Password

        dotnet publish WordStation.WebUI -c Release `
          /p:WebPublishMethod=MSDeploy `
          /p:MSDeployPublishMethod=WMSVC `
          /p:MsDeployServiceUrl="$server" `
          /p:DeployIisAppPath="$site" `
          /p:UserName="$user" `
          /p:Password="$pass" `
          /p:AllowUntrustedCertificate=true `
          /p:EnableMsDeployAppOffline=true `
          /p:SkipExtraFilesOnServer=true
