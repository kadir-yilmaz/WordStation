name: WebAPI-CI

on:
  push:
    branches: [ main ]
    paths:
      - 'WordStation.WebAPI/**'
      - 'WordStation.BLL/**'
      - 'WordStation.DAL/**'
      - 'WordStation.EL/**'
      - 'WordStation.Tests/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'WordStation.WebAPI/**'
      - 'WordStation.BLL/**'
      - 'WordStation.DAL/**'
      - 'WordStation.EL/**'
      - 'WordStation.Tests/**'

jobs:
  test:
    name: Build & Test API
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore
      run: dotnet restore
    - name: Run API Tests
      run: dotnet test WordStation.Tests --no-restore -c Release
