name: WebAPI-CD

on:
  workflow_dispatch: # GitHub UI üzerinden manuel olarak tetiklemeyi sağlar
  workflow_run:
    workflows: ["WebAPI-CI"]
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    name: Deploy WebAPI
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore
      run: dotnet restore
    - name: Create appsettings.json from Secrets
      shell: pwsh
      env:
        APPSETTINGS_JSON: ${{ secrets.API_APPSETTINGS_JSON }}
      run: |
        $env:APPSETTINGS_JSON | Out-File -FilePath "WordStation.WebAPI/appsettings.json" -Encoding utf8
    - name: Deploy API
      shell: pwsh
      env:
        WEB_DEPLOY_JSON: ${{ secrets.WEB_DEPLOY_JSON }}
      run: |
        $deployConfig = $env:WEB_DEPLOY_JSON | ConvertFrom-Json
        $server = $deployConfig.WebAPI.Server
        if (-not $server.StartsWith("http")) {
            $server = "https://$server/MsDeploy.axd"
        }
        $site = $deployConfig.WebAPI.SiteName
        $user = $deployConfig.WebAPI.UserName
        $pass = $deployConfig.WebAPI.Password

        dotnet publish WordStation.WebAPI -c Release `
          /p:WebPublishMethod=MSDeploy `
          /p:MSDeployPublishMethod=WMSVC `
          /p:MsDeployServiceUrl="$server" `
          /p:DeployIisAppPath="$site" `
          /p:UserName="$user" `
          /p:Password="$pass" `
          /p:AllowUntrustedCertificate=true `
          /p:EnableMsDeployAppOffline=true `
          /p:SkipExtraFilesOnServer=true
