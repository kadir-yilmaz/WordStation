name: Deploy WebUI

on:
  push:
    branches: [ main ]
    paths:
      - 'WordStation.WebUI/**'
      - 'WordStation.BLL/**'
      - 'WordStation.DAL/**'
      - 'WordStation.EL/**'
      - '.github/workflows/deploy-webui.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore WordStation.WebUI
    
    - name: Build
      run: dotnet build WordStation.WebUI -c Release --no-restore
    
    - name: Publish
      run: dotnet publish WordStation.WebUI -c Release -o ./publish --no-build
    
    - name: Deploy via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: ./
        state-name: .ftp-deploy-sync-state.json
        log-level: verbose
