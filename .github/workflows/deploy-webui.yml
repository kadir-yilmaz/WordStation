name: Deploy WebUI

on:
  push:
    branches: [ main ]
    paths:
      - 'WordStation.WebUI/**'
      - 'WordStation.BLL/**'
      - 'WordStation.DAL/**'
      - 'WordStation.EL/**'
      - '.github/workflows/deploy-webui.yml'

jobs:
  build-and-deploy:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore WordStation.WebUI
    
    - name: Build
      run: dotnet build WordStation.WebUI -c Release --no-restore
    
    - name: Deploy with Web Deploy
      run: |
        dotnet publish WordStation.WebUI -c Release `
          /p:WebPublishMethod=MSDeploy `
          /p:MsDeployServiceUrl=https://${{ secrets.WEBDEPLOY_SERVER }}:8172/msdeploy.axd `
          /p:DeployIisAppPath=${{ secrets.WEBDEPLOY_SITENAME }} `
          /p:UserName=${{ secrets.WEBDEPLOY_USERNAME }} `
          /p:Password=${{ secrets.WEBDEPLOY_PASSWORD }} `
          /p:AllowUntrustedCertificate=true `
          /p:AuthType=Basic
